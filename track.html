<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="UTF-8">
    <title>تتبع اشتراكاتك | حلم نور</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <div class="card" style="background:white; padding:30px; border-radius:20px; box-shadow:0 10px 25px rgba(0,0,0,0.1);">
            <h1>تتبع حالة اشتراكك 🔍</h1>
            <p style="color:#666; margin-bottom:20px;">أدخل رقم الموبايل لعرض كل حصصك المفعلة</p>
            <input type="text" id="searchPhone" placeholder="أدخل رقم موبايلك هنا" style="width:100%; padding:15px; border-radius:10px; border:2px solid #ddd; font-family:'Cairo'; font-size:18px; text-align:center; outline:none; margin-bottom:15px;">
            <button id="mainBtn" class="btn-main-hero" style="width:100%" onclick="checkStatus()">بحث عن اشتراكاتي</button>
            
            <div id="resultsArea" style="margin-top:25px;"></div>
        </div>
        <button onclick="location.href='index.html'" class="btn-back">⬅️ العودة للرئيسية</button>
    </div>

    <script>
        // إعداد Supabase
        const SUPABASE_URL = 'https://viutmpktcgceyofuxmus.supabase.co'; 
        const SUPABASE_KEY = 'sb_publishable_QoIPp4IFBEdES90fNOqbKg_6kIF0GeO';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // الدالة الجديدة لاستخراج موديل الموبايل بدقة
        function getDeviceDetailedName() {
            const ua = navigator.userAgent;
            let deviceDetail = "جهاز غير معروف";

            if (/android/i.test(ua)) {
                // مصفوفة لمحاولة صيد موديل الموبايل من نصوص الـ User Agent
                const androidMatch = ua.match(/Android\s+([^\s;]+);?\s+([^;)]+)/);
                if (androidMatch) {
                    let model = androidMatch[2].trim();
                    // تنظيف الموديل من الكلمات الزائدة
                    model = model.split('Build/')[0].trim();
                    deviceDetail = "أندرويد (" + model + ")";
                } else {
                    deviceDetail = "جهاز أندرويد";
                }
            } else if (/iPad|iPhone|iPod/.test(ua)) {
                // للآيفون المتصفح لا يعطي الموديل (مثل iPhone 13) بل يعطي iPhone فقط للخصوصية
                deviceDetail = "آيفون/آيباد (iOS)";
            } else if (/Windows NT/i.test(ua)) {
                deviceDetail = "كمبيوتر (Windows)";
            } else if (/Macintosh/i.test(ua)) {
                deviceDetail = "كمبيوتر (Mac)";
            } else {
                deviceDetail = "متصفح ويب";
            }
            return deviceDetail;
        }

        async function checkStatus() {
            const phone = document.getElementById('searchPhone').value.trim();
            const resultsArea = document.getElementById('resultsArea');
            const btn = document.getElementById('mainBtn');

            if (phone.length < 11) {
                alert("برجاء إدخال رقم موبايل صحيح مكون من 11 رقم");
                return;
            }

            btn.disabled = true;
            btn.innerText = "جاري فحص الجهاز والاشتراك... 🔄";
            resultsArea.innerHTML = "";

            try {
                const { data: subs, error: subError } = await supabaseClient
                    .from('user_subscriptions')
                    .select('*')
                    .eq('phone', phone);

                if (subError) throw subError;

                if (!subs || subs.length === 0) {
                    btn.disabled = false;
                    btn.innerText = "بحث عن اشتراكاتي";
                    resultsArea.innerHTML = `
                        <div style="background:#ffebee; color:#c62828; padding:15px; border-radius:10px; border: 1px solid #ef9a9a;">
                            لا توجد اشتراكات مفعلة لهذا الرقم (<b>${phone}</b>) حالياً. 
                        </div>`;
                    return;
                }

                let localDeviceID = localStorage.getItem('my_device_id');
                const detailedDeviceName = getDeviceDetailedName(); 
                const firstSub = subs[0];

                if (!localDeviceID) {
                    localDeviceID = 'dev-' + Math.random().toString(36).substr(2, 9) + Date.now();
                    localStorage.setItem('my_device_id', localDeviceID);
                }

                // تحديث البيانات لو الخانة فاضية (أول دخول بالكود الجديد)
                if (!firstSub.device_id || firstSub.device_name === "موبايل") {
                    const { error: upError } = await supabaseClient
                        .from('user_subscriptions')
                        .update({ 
                            device_id: localDeviceID, 
                            device_name: detailedDeviceName 
                        })
                        .eq('phone', phone);
                        
                    if(upError) throw upError;
                    
                    alert("✅ تم ربط جهازك: " + detailedDeviceName);
                    firstSub.device_id = localDeviceID;
                    firstSub.device_name = detailedDeviceName;
                } 

                // التحقق من الحماية
                if (firstSub.device_id !== localDeviceID) {
                    btn.disabled = false;
                    btn.innerText = "بحث عن اشتراكاتي";
                    resultsArea.innerHTML = `
                        <div style="background:#fff3cd; color:#856404; padding:15px; border-radius:10px; border: 1px solid #ffeeba; text-align:center;">
                            ⚠️ عذراً، هذا الحساب مرتبط بجهاز آخر: <br>
                            <b style="color:#d35400;">(${firstSub.device_name})</b> <br><br>
                            يرجى استخدامه من الجهاز الأصلي.
                        </div>`;
                    return;
                }

                resultsArea.innerHTML = "<h3 style='margin-bottom:15px;'>حصصك المتاحة حالياً:</h3>";
                for (let sub of subs) {
                    await displayCategoryLessons(sub.category, resultsArea);
                }
                
                btn.disabled = false;
                btn.innerText = "تحديث القائمة 🔄";

            } catch (err) {
                console.error("Error:", err);
                resultsArea.innerHTML = "<p style='color:red'>حدث خطأ تقني.</p>";
                btn.disabled = false;
                btn.innerText = "بحث عن اشتراكاتي";
            }
        }

        async function displayCategoryLessons(category, container) {
            const sectionBox = document.createElement('div');
            sectionBox.style = "background:#f9f9f9; padding:15px; border-radius:15px; margin-bottom:15px; border-right:5px solid #3498db; text-align:right;";
            sectionBox.innerHTML = `<h3 style="margin:0 0 10px 0; color:#2c3e50; font-size:18px;">📚 قسم: ${category}</h3>`;
            container.appendChild(sectionBox);

            const { data: lessons } = await supabaseClient
                .from('lessons')
                .select('*')
                .eq('category', category.trim());

            if (lessons && lessons.length > 0) {
                lessons.forEach((video, index) => {
                    const btn = document.createElement('button');
                    btn.className = 'btn-main-hero';
                    btn.style = "background:linear-gradient(135deg, #3498db, #2980b9); width:100%; margin-bottom:8px; padding:12px; color:white; border-radius:10px; cursor:pointer; border:none; text-align:right;";
                    btn.innerHTML = `🎬 حصة (${index + 1}): ${video.title}`;
                    btn.onclick = () => {
                        location.href = `video-player.html?video=${encodeURIComponent(video.url)}&title=${encodeURIComponent(video.title)}`;
                    };
                    sectionBox.appendChild(btn);
                });
            }
        }
    </script>
</body>
</html>
