<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بوابة أولياء الأمور - سنتر حلم نور</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --primary: #f1c40f; --dark: #2c3e50; }
        body { background: #f4f7f6; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .parents-container { max-width: 800px; margin: 50px auto; padding: 20px; }
        .search-card { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); text-align: center; }
        .search-box { display: flex; gap: 10px; margin-top: 20px; }
        input { flex: 1; padding: 12px; border: 2px solid #ddd; border-radius: 8px; outline: none; font-size: 16px; }
        input:focus { border-color: var(--primary); }
        .btn-search { background: var(--dark); color: white; border: none; padding: 0 25px; border-radius: 8px; cursor: pointer; transition: 0.3s; }
        .btn-search:hover { background: #1a252f; }
        #resultArea { margin-top: 30px; display: none; }
        .result-card { background: white; padding: 20px; border-radius: 12px; border-right: 5px solid var(--primary); box-shadow: 0 5px 15px rgba(0,0,0,0.05); }
        .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 15px; }
        .info-item { background: #f8f9fa; padding: 10px; border-radius: 5px; }
        .info-item label { display: block; font-size: 12px; color: #7f8c8d; }
        .info-item span { font-weight: bold; color: var(--dark); }
    </style>
</head>
<body>

    <nav class="navbar">
        <a href="index.html" class="nav-logo">🌟 سنتر حلم نور</a>
    </nav>

    <div class="parents-container">
        <div class="search-card">
            <h2>🔍 استعلام عن مستوى الطالب</h2>
            <p>أدخل كود الطالب المكون من أرقام لمتابعة الدرجات والغياب</p>
            <div class="search-box">
                <input type="text" id="studentCodeInput" placeholder="أدخل كود الطالب هنا...">
                <button class="btn-search" onclick="checkProgress()">بحث</button>
            </div>
        </div>

        <div id="resultArea">
            </div>
    </div>

    <script>
        // بيانات سوبابيز (حط بياناتك هنا زي ملف الأدمن)
        const SUPABASE_URL = 'YOUR_SUPABASE_URL';
        const SUPABASE_KEY = 'YOUR_SUPABASE_ANON_KEY';
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        async function checkProgress() {
            const code = document.getElementById('studentCodeInput').value;
            const resultArea = document.getElementById('resultArea');
            
            if(!code) { alert('من فضلك أدخل الكود'); return; }

            const { data, error } = await supabase
                .from('student_progress')
                .select('*')
                .eq('student_code', code)
                .single();

            if (error || !data) {
                resultArea.style.display = 'block';
                resultArea.innerHTML = '<div class="result-card" style="border-right-color: #e74c3c;">❌ عذراً، لم يتم العثور على بيانات لهذا الكود.</div>';
            } else {
                resultArea.style.display = 'block';
                resultArea.innerHTML = `
                    <div class="result-card">
                        <h3>تقرير الطالب: ${data.student_name}</h3>
                        <div class="info-grid">
                            <div class="info-item"><label>الحضور</label><span>${data.attendance}</span></div>
                            <div class="info-item"><label>التفاعل</label><span>${data.interaction}</span></div>
                            <div class="info-item"><label>درجة آخر اختبار</label><span style="color: #27ae60;">${data.exam_grade}</span></div>
                            <div class="info-item"><label>تاريخ التحديث</label><span>${new Date(data.created_at).toLocaleDateString('ar-EG')}</span></div>
                        </div>
                    </div>
                `;
            }
        }
    </script>
</body>
</html>
