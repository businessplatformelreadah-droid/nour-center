<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بوابة أولياء الأمور | أكاديمية حلم نور</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --main: #2c3e50; --accent: #3498db; --success: #27ae60; --bg: #f4f7f6; }
        body { font-family: 'Cairo', sans-serif; background: var(--bg); margin: 0; padding: 20px; direction: rtl; }
        .search-container { max-width: 500px; margin: 50px auto; background: white; padding: 30px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); text-align: center; }
        h1 { color: var(--main); margin-bottom: 25px; font-size: 24px; }
        input { width: 100%; padding: 15px; margin-bottom: 15px; border: 2px solid #ddd; border-radius: 12px; outline: none; font-family: 'Cairo'; font-size: 18px; box-sizing: border-box; text-align: center; }
        .btn-search { background: var(--main); color: white; border: none; padding: 15px 30px; border-radius: 12px; cursor: pointer; width: 100%; font-weight: bold; font-size: 18px; transition: 0.3s; }
        .btn-search:hover { background: var(--accent); }
        
        .result-card { display: none; max-width: 600px; margin: 20px auto; background: white; padding: 25px; border-radius: 20px; box-shadow: 0 10px 20px rgba(0,0,0,0.05); border-right: 8px solid var(--success); }
        .info-row { display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px dashed #eee; }
        .info-row:last-child { border: none; }
        .label { font-weight: bold; color: #7f8c8d; }
        .value { color: var(--main); font-weight: 700; }
        .no-data { color: #e74c3c; margin-top: 20px; display: none; }
    </style>
</head>
<body>

    <div class="search-container">
        <h1>📊 متابعة مستوى الطالب</h1>
        <input type="text" id="studentCodeInput" placeholder="أدخل كود الطالب هنا">
        <button class="btn-search" onclick="searchProgress()">عرض التقرير الآن</button>
        <p id="errorMsg" class="no-data">❌ عذراً، لا يوجد بيانات لهذا الكود</p>
    </div>

    <div id="resultCard" class="result-card">
        <h2 style="text-align: center; color: var(--success);">تقرير الأداء الدراسي ✅</h2>
        
        <div class="info-row">
            <span class="label">اسم الطالب:</span>
            <span id="resName" class="value"></span>
        </div>
        
        <div class="info-row">
            <span class="label">كود الطالب:</span>
            <span id="resCode" class="value"></span>
        </div>
        
        <div class="info-row">
            <span class="label">المادة الدراسية:</span>
            <span id="resSubject" class="value"></span>
        </div>
        
        <div class="info-row">
            <span class="label">الحضور والغياب:</span>
            <span id="resAttend" class="value"></span>
        </div>
        
        <div class="info-row">
            <span class="label">مستوى الطالب (التفاعل):</span>
            <span id="resInter" class="value" style="color: var(--accent);"></span>
        </div>
        
        <div class="info-row">
            <span class="label">درجة الامتحان:</span>
            <span id="resGrade" class="value" style="color: #e67e22;"></span>
        </div>
    </div>

<script>
    const SUPABASE_URL = 'https://viutmpktcgceyofuxmus.supabase.co'; 
    const SUPABASE_KEY = 'sb_publishable_QoIPp4IFBEdES90fNOqbKg_6kIF0GeO';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    async function searchProgress() {
        const code = document.getElementById('studentCodeInput').value.trim();
        const card = document.getElementById('resultCard');
        const errorMsg = document.getElementById('errorMsg');

        if(!code) return alert("من فضلك اكتب الكود أولاً");

        // البحث في جدول student_progress باستخدام الكود
        const { data, error } = await supabaseClient
            .from('student_progress')
            .select('*')
            .eq('student_code', code)
            .order('created_at', { ascending: false }) // يجيب أحدث درجة مضافة
            .limit(1)
            .single();

        if (data) {
            errorMsg.style.display = 'none';
            card.style.display = 'block';
            
            // ربط الخانات اللي أنت طلبتها
            document.getElementById('resName').innerText = data.student_name;
            document.getElementById('resCode').innerText = data.student_code;
            document.getElementById('resSubject').innerText = data.subject_name || 'غير محدد';
            document.getElementById('resAttend').innerText = data.attendance;
            document.getElementById('resInter').innerText = data.student_level || data.interaction || 'غير محدد';
            document.getElementById('resGrade').innerText = data.exam_grade;
        } else {
            card.style.display = 'none';
            errorMsg.style.display = 'block';
        }
    }
</script>

</body>
</html>
