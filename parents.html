<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متابعة مستوى الطالب | حلم نور</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; background: #f4f7f6; direction: rtl; padding: 20px; }
        .container { max-width: 600px; margin: auto; }
        .card { background: white; padding: 25px; border-radius: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); text-align: center; }
        input { width: 100%; padding: 12px; margin: 15px 0; border: 2px solid #ddd; border-radius: 10px; font-size: 18px; text-align: center; box-sizing: border-box; }
        button { background: #27ae60; color: white; border: none; padding: 12px 25px; border-radius: 10px; cursor: pointer; font-size: 18px; width: 100%; }
        table { width: 100%; margin-top: 20px; border-collapse: collapse; background: #fff; border-radius: 10px; overflow: hidden; }
        th, td { padding: 12px; border: 1px solid #eee; text-align: center; }
        th { background: #2c3e50; color: white; }
        .header { margin-bottom: 20px; color: #2c3e50; }
    </style>
</head>
<body>

<div class="container">
    <div class="card">
        <h2 class="header">👨‍👩‍👧‍👦 بوابة أولياء الأمور</h2>
        <p>أدخل كود الطالب لمتابعة مستواه ودرجاته</p>
        <input type="text" id="parentCode" placeholder="أدخل كود الطالب هنا">
        <button onclick="getStudentReport()">عرض التقرير 📊</button>
    </div>

    <div id="reportArea" style="display:none; margin-top:30px;">
        <div class="card">
            <h3 id="studentDisplayName" style="color:#27ae60;"></h3>
            <table>
                <thead>
                    <tr>
                        <th>البيان</th>
                        <th>الحالة / الدرجة</th>
                    </tr>
                </thead>
                <tbody id="reportTableBody"></tbody>
            </table>
            <p id="reportDate" style="margin-top:15px; font-size:14px; color:#666;"></p>
        </div>
    </div>
</div>

<script>
    const SUPABASE_URL = 'https://viutmpktcgceyofuxmus.supabase.co'; 
    const SUPABASE_KEY = 'sb_publishable_QoIPp4IFBEdES90fNOqbKg_6kIF0GeO';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    async function getStudentReport() {
        const code = document.getElementById('parentCode').value.trim();
        if(!code) return alert("يرجى إدخال الكود");

        const { data, error } = await supabaseClient
            .from('student_progress')
            .select('*')
            .eq('student_code', code)
            .order('id', { ascending: false })
            .limit(1); // عرض آخر تحديث

        if (error || !data || data.length === 0) {
            return alert("الكود غير صحيح أو لم يتم تسجيل بيانات بعد");
        }

        const s = data[0];
        document.getElementById('reportArea').style.display = 'block';
        document.getElementById('studentDisplayName').innerText = "طالب: " + s.student_name;
        
        document.getElementById('reportTableBody').innerHTML = `
            <tr><td>كود الطالب</td><td><b>${s.student_code}</b></td></tr>
            <tr><td>الحضور والغياب</td><td>${s.attendance}</td></tr>
            <tr><td>مستوى التفاعل</td><td>${s.interaction}</td></tr>
            <tr><td>درجة الامتحان</td><td><b style="color:#e74c3c;">${s.exam_grade}</b></td></tr>
        `;
        document.getElementById('reportDate').innerText = "تاريخ التحديث: " + new Date(s.created_at).toLocaleDateString('ar-EG');
    }
</script>
</body>
</html>
