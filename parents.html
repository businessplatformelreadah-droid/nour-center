<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بوابة أولياء الأمور - سنتر حلم نور</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --primary: #f1c40f; --dark: #2c3e50; --accent: #3498db; }
        body { background: #f4f7f6; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; }
        .parents-container { max-width: 800px; margin: 50px auto; padding: 20px; }
        .search-card { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); text-align: center; margin-bottom: 30px; }
        .search-box { display: flex; gap: 10px; margin-top: 20px; }
        input { flex: 1; padding: 12px; border: 2px solid #ddd; border-radius: 8px; outline: none; font-size: 16px; text-align: center; }
        input:focus { border-color: var(--primary); }
        .btn-search { background: var(--dark); color: white; border: none; padding: 0 25px; border-radius: 8px; cursor: pointer; transition: 0.3s; font-weight: bold; }
        
        /* تصميم الكروت المتعددة */
        .results-wrapper { display: flex; flex-direction: column; gap: 20px; }
        .result-card { background: white; padding: 25px; border-radius: 12px; border-right: 8px solid var(--primary); box-shadow: 0 5px 15px rgba(0,0,0,0.05); animation: fadeIn 0.5s ease; }
        .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 20px; }
        .info-item { background: #f8f9fa; padding: 15px; border-radius: 10px; border: 1px solid #eee; }
        .info-item label { display: block; font-size: 13px; color: #7f8c8d; margin-bottom: 5px; }
        .info-item span { font-weight: bold; color: var(--dark); font-size: 18px; }
        
        .subject-badge { background: var(--accent) !important; border: none !important; color: white !important; }
        .subject-badge label { color: rgba(255,255,255,0.8) !important; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <a href="index.html" class="nav-logo">🌟 سنتر حلم نور</a>
    </nav>

    <div class="parents-container">
        <div class="search-card">
            <h2>🔍 استعلام عن مستوى الطالب</h2>
            <p>أدخل كود الطالب لمتابعة تقارير جميع المواد</p>
            <div class="search-box">
                <input type="text" id="studentCodeInput" placeholder="اكتب كود الطالب هنا...">
                <button class="btn-search" id="searchBtn" onclick="checkProgress()">بحث الآن</button>
            </div>
        </div>

        <div id="resultArea" class="results-wrapper"></div>
    </div>

    <script>
        const SB_URL = 'https://viutmpktcgceyofuxmus.supabase.co'; 
        const SB_KEY = 'sb_publishable_QoIPp4IFBEdES90fNOqbKg_6kIF0GeO';
        const supabaseClient = supabase.createClient(SB_URL, SB_KEY);

        async function checkProgress() {
            const inputField = document.getElementById('studentCodeInput');
            const resultArea = document.getElementById('resultArea');
            const searchBtn = document.getElementById('searchBtn');
            const code = inputField.value.trim();
            
            if(!code) { alert('أدخل كود الطالب'); return; }

            searchBtn.innerText = "جاري البحث...";
            searchBtn.disabled = true;
            resultArea.innerHTML = ""; // مسح النتائج القديمة

            try {
                // شلنا .single() واستخدمنا البحث العادي لجلب "كل" الصفوف اللي ليها نفس الكود
                const { data, error } = await supabaseClient
                    .from('student_progress')
                    .select('*')
                    .eq('student_code', code)
                    .order('created_at', { ascending: false }); // ترتيب من الأحدث للأقدم

                if (error || !data || data.length === 0) {
                    resultArea.innerHTML = `<div class="result-card" style="border-right-color: #e74c3c;"><h3>❌ لا توجد بيانات لهذا الكود</h3></div>`;
                } else {
                    // عرض اسم الطالب مرة واحدة فوق
                    const welcomeMsg = `<h2 style="text-align:center; color:var(--dark);">تقارير الطالب: ${data[0].student_name}</h2>`;
                    resultArea.insertAdjacentHTML('beforeend', welcomeMsg);

                    // عمل Loop لعرض كل مادة في كارت لوحدها
                    data.forEach(item => {
                        const card = `
                            <div class="result-card">
                                <div class="info-grid">
                                    <div class="info-item subject-badge">
                                        <label><i class="fas fa-book"></i> المادة</label>
                                        <span>${item.subject_name || 'عام'}</span>
                                    </div>
                                    <div class="info-item">
                                        <label><i class="fas fa-star"></i> الدرجة</label>
                                        <span style="color: #27ae60;">${item.exam_grade || '0'}</span>
                                    </div>
                                    <div class="info-item">
                                        <label><i class="fas fa-user-check"></i> الحضور</label>
                                        <span>${item.attendance || '-'}</span>
                                    </div>
                                    <div class="info-item">
                                        <label><i class="fas fa-calendar-day"></i> التاريخ</label>
                                        <span>${new Date(item.created_at).toLocaleDateString('ar-EG')}</span>
                                    </div>
                                </div>
                            </div>
                        `;
                        resultArea.insertAdjacentHTML('beforeend', card);
                    });
                }
            } catch (err) {
                alert('خطأ في الاتصال');
            } finally {
                searchBtn.innerText = "بحث الآن";
                searchBtn.disabled = false;
            }
        }
    </script>
</body>
</html>
