<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بوابة أولياء الأمور | أكاديمية حلم نور</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --main: #2c3e50; --accent: #3498db; --success: #27ae60; --bg: #f4f7f6; }
        body { font-family: 'Cairo', sans-serif; background: var(--bg); margin: 0; padding: 20px; direction: rtl; }
        .search-container { max-width: 500px; margin: 30px auto; background: white; padding: 25px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); text-align: center; }
        input { width: 100%; padding: 15px; margin-bottom: 15px; border: 2px solid #ddd; border-radius: 12px; outline: none; font-family: 'Cairo'; font-size: 18px; box-sizing: border-box; text-align: center; }
        .btn-search { background: var(--main); color: white; border: none; padding: 15px; border-radius: 12px; cursor: pointer; width: 100%; font-weight: bold; font-size: 18px; }
        .result-card { background: white; padding: 20px; border-radius: 15px; margin-bottom: 20px; box-shadow: 0 5px 15px rgba(0,0,0,0.05); border-right: 6px solid var(--success); }
        .info-row { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px dashed #eee; }
        .label { font-weight: bold; color: #7f8c8d; }
        .value { color: var(--main); font-weight: 700; }
    </style>
</head>
<body>

    <div class="search-container">
        <h2>📊 متابعة مستوى الطالب</h2>
        <input type="text" id="studentCodeInput" placeholder="أدخل كود الطالب هنا">
        <button class="btn-search" onclick="searchProgress()">عرض التقارير</button>
        <p id="errorMsg" style="display:none; color:red; margin-top:15px;">❌ لا توجد بيانات مسجلة لهذا الكود</p>
    </div>

    <div id="resultsWrapper" style="max-width: 600px; margin: auto;"></div>

<script>
    const SUPABASE_URL = 'https://viutmpktcgceyofuxmus.supabase.co'; 
    const SUPABASE_KEY = 'sb_publishable_QoIPp4IFBEdES90fNOqbKg_6kIF0GeO';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    async function searchProgress() {
        // الـ .trim() هنا بتمسح أي مسافات الطالب كتبها غلط
        const code = document.getElementById('studentCodeInput').value.trim();
        const wrapper = document.getElementById('resultsWrapper');
        const errorMsg = document.getElementById('errorMsg');

        if(!code) return alert("اكتب الكود أولاً");

        wrapper.innerHTML = "جاري التحميل..."; 
        errorMsg.style.display = 'none';

        const { data, error } = await supabaseClient
            .from('student_progress')
            .select('*')
            .eq('student_code', code)
            .order('created_at', { ascending: false });

        wrapper.innerHTML = ""; 

        if (data && data.length > 0) {
            data.forEach(item => {
                wrapper.innerHTML += `
                    <div class="result-card">
                        <h3 style="text-align:center; color:var(--accent)">مادة: ${item.subject_name || 'عام'}</h3>
                        <div class="info-row"><span class="label">الطالب:</span><span class="value">${item.student_name}</span></div>
                        <div class="info-row"><span class="label">الكود:</span><span class="value">${item.student_code}</span></div>
                        <div class="info-row"><span class="label">الحضور:</span><span class="value">${item.attendance}</span></div>
                        <div class="info-row"><span class="label">المستوى:</span><span class="value">${item.student_level || item.interaction}</span></div>
                        <div class="info-row"><span class="label">الدرجة:</span><span class="value" style="color:orange">${item.exam_grade}</span></div>
                        <div class="info-row"><span class="label">التاريخ:</span><span class="value">${new Date(item.created_at).toLocaleDateString('ar-EG')}</span></div>
                    </div>
                `;
            });
        } else {
            errorMsg.style.display = 'block';
        }
    }
</script>
</body>
</html>
